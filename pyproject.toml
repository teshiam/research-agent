[project]
name = "research-agent"
version = "0.1.0"
description = "An autonomous research agent that plans, searches, reads and writes cited reports, with a live step-by-step dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.40",
]

[project.optional-dependencies]
ddg = ["ddgs>=9"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long prompt strings and one-line test fixtures are fine

[tool.pytest.ini_options]
testpaths = ["tests"]
